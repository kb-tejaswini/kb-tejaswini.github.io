<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="500" fill="#f6f4f0"/>
  <text x="400" y="62" text-anchor="middle" font-size="26" font-weight="600" fill="#1d1d1d">How the agent works</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8f4316"/>
    </marker>
  </defs>
  <g font-size="19" fill="#1d1d1d" text-anchor="middle">
    <rect x="40" y="110" width="320" height="120" rx="16" fill="#fff" stroke="#e1dbd1" stroke-width="2"/>
    <text x="200" y="160" font-weight="600">1. Placement emails</text>
    <text x="200" y="192" fill="#5b5750" font-size="17">arrive in Gmail</text>

    <rect x="440" y="110" width="320" height="120" rx="16" fill="#fff" stroke="#e1dbd1" stroke-width="2"/>
    <text x="600" y="160" font-weight="600">2. Agent reads them</text>
    <text x="600" y="192" fill="#5b5750" font-size="17">finds dates and deadlines</text>

    <rect x="40" y="320" width="320" height="120" rx="16" fill="#fff" stroke="#e1dbd1" stroke-width="2"/>
    <text x="200" y="370" font-weight="600">3. You review</text>
    <text x="200" y="402" fill="#5b5750" font-size="17">approve or skip each one</text>

    <rect x="440" y="320" width="320" height="120" rx="16" fill="#e9f1ff" stroke="#b9cff5" stroke-width="2"/>
    <text x="600" y="370" font-weight="600">4. Calendar reminder</text>
    <text x="600" y="402" fill="#5b5750" font-size="17">added to Google Calendar</text>
  </g>
  <g stroke="#8f4316" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M362 170H432"/>
    <path d="M600 232V270H200V312"/>
    <path d="M362 380H432"/>
  </g>
</svg>
